schema_version: 1
case_id: ASR-NEAR-20261030T150952-03-WAITING-CITY
title: 近距离ASR对照／等待提示期间改查成都
domain: ai
severity: important
source:
  kind: user_requested_asr_diagnostic
  request: 用户连接同一设备并放近，要求模拟几轮ASR；不改音量、不发硬件控制。
  placement: user moved closer; physical distance unmeasured
  scope: 只核本轮播放与最终ASR完整性；字幕、独立录音ASR、产品语义分别记录，不以设备ASR缺词直接判具体故障层。
  execution_choices:
  - 固定三房，每房最多90秒；每房确认关房才继续。未取得input_ready记阻塞，不给未播放的话术填识别结论。
  - 第一房短句与前一回复结束后输入分开；第二房复用原查询后紧接聊天时序；第三房复用等待提示期间改城市时序。
  - 同句复用原语音库字节；除用户移动位置外不主动改条件，服务端当下版本未知，不据少量样本证明距离因果。
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
  - device_ui_exit
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 18
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 18
- kind: audio_play
  name: beijing
  params:
    text: 查北京今天的天气
- kind: wait_event
  name: search_waiting_prompt
  params:
    event: voice.tts_text_changed
    where:
      source: worker
    text_contains_any:
    - 查
    - 稍等
    - 等我
    same_trace: true
    after_last_play: true
    timeout_s: 18
- kind: audio_play
  name: chengdu
  params:
    text: 改查成都今天的天气
- kind: audio_record
  name: recognition_observation
  params:
    max_seconds: 25
cleanup:
- kind: device_action
  name: cleanup_home
  params:
    action: exit_voice
    if_session_active: true
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 12
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
