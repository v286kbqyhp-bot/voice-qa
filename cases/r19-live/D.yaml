schema_version: 1
case_id: R19-LIVE-D
title: R19 D 全流程动作与采证
domain: ai
severity: important
source:
  manifest: sources/r19/manifest.json
  original_sha256: 1b7606ba1658c894cf454ca6b78a55718f242949a72cd928a49151b248b6d9c9
  sections:
  - D
  receipt_template: r19_v1
  scope: 完整动作尝试；结束与插话使用JSON字幕/PCM日志及麦克风能量调度代理；产品声学和语义仍需复核
  execution_choices:
  - 退出操作使用预生成“不聊了”
  - H紧接C以保留同会话上下文
  - 静音参数为调度校准，不是新增产品标准
  - 兼容就绪保留实际路径，不当正常P2通过
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    timeout_s: 20
    bind_trace: true
    where:
      source: hardware
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    timeout_s: 20
    alternative_events:
    - input_ready_fallback
    same_trace: true
- kind: audio_play
  name: D_query
  params:
    text: 帮我查一下恐龙为什么会灭绝。
- kind: wait_speech
  name: D_body_active
  params:
    role: body
    timeout_s: 40
    delay_s: 1.0
- kind: audio_play
  name: D_interrupt
  params:
    text: 停一下，我先说一句，我今天看了一本科普书。
- kind: wait_output
  name: D_chat_done
  params:
    role: any
    timeout_s: 45
    quiet_s: 1.0
- kind: audio_play
  name: D_resume
  params:
    text: 继续刚才的搜索结果。
- kind: wait_output
  name: D_resume_done
  params:
    role: body
    timeout_s: 45
    quiet_s: 1.0
cleanup:
- kind: audio_play
  name: cleanup_exit
  params:
    text: 不聊了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    after_last_play: true
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
