schema_version: 1
case_id: R19-D-LOCAL-PHASE
title: D 正文中途插话：本地内容规则即时触发
domain: ai
severity: important
source:
  manifest: sources/r19/manifest.json
  original_sha256: 1b7606ba1658c894cf454ca6b78a55718f242949a72cd928a49151b248b6d9c9
  sections:
  - D
  receipt_template: r19_v1
  scope: D准确话术；本地关键词规则分类正文并校验当前会话与声音；非服务端原生role，不声称精确50%进度
  execution_choices:
  - 不在时机关键路径调用OpenAI或等待Agent返回
  - 本地规则需正文实质词并排除过渡/失败词；仅验证D题目
  - 实际插话位置以录音与日志复核；不以播放API代替设备ASR
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    timeout_s: 20
    bind_trace: true
    where:
      source: hardware
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    timeout_s: 20
    alternative_events:
    - input_ready_fallback
    same_trace: true
- kind: audio_play
  name: D_query
  params:
    text: 帮我查一下恐龙为什么会灭绝。
- kind: wait_speech
  name: D_body_active
  params:
    role: any
    phase_role: search_body
    timeout_s: 45
    require_sound: true
- kind: audio_play
  name: D_interrupt
  params:
    text: 停一下，我先说一句，我今天看了一本科普书。
- kind: wait_event
  name: D_interrupt_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 科普书
    - 先说一句
    - 看了一本
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: D_chat_done
  params:
    role: any
    timeout_s: 45
    quiet_s: 1.0
- kind: audio_play
  name: D_resume
  params:
    text: 继续刚才的搜索结果。
- kind: wait_output
  name: D_resume_done
  params:
    role: body
    timeout_s: 45
    quiet_s: 1.0
cleanup:
- kind: audio_play
  name: cleanup_exit
  params:
    text: 不聊了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    after_last_play: true
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
