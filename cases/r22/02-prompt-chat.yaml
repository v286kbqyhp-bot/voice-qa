schema_version: 1
case_id: R22-02-PROMPT-CHAT
title: R22 2 听到查询提示即插话
domain: ai
severity: important
source:
  manifest: sources/r22/manifest.json
  section: '2'
  original_sha256: 2ba7a35b281a0f9a271d7570439701fae2d8f5df0428bc599ae48e4aa335ce77
  scope: 用户选定R22回执；预生成WAV执行，日志/采集/产品结论分别保存
  execution_choices:
  - 原要求听到提示后插话；不附加等待提示结束后的空隙。保留原02两次错失窗口记录，独立核验修正调度。
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: query
  params:
    text: 帮我查一下羽毛球双打后发球线是哪条。
- kind: wait_event
  name: query_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 羽毛球
    - 双打
    - 发球线
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_speech
  name: search_bridge
  params:
    role: ack
    require_sound: false
    timeout_s: 35
- kind: audio_play
  name: chat
  params:
    text: 我今天体育课跑了第一名
- kind: wait_event
  name: chat_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 体育课
    - 第一名
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: audio_record
  name: background_observation
  params:
    max_seconds: 35
cleanup:
- kind: audio_play
  name: cleanup_exit
  params:
    text: 不聊了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
