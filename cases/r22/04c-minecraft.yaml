schema_version: 1
case_id: R22-04C-MINECRAFT
title: R22 4c 我的世界最新更新
domain: ai
severity: important
source:
  manifest: sources/r22/manifest.json
  section: '4'
  original_sha256: 2ba7a35b281a0f9a271d7570439701fae2d8f5df0428bc599ae48e4aa335ce77
  scope: 用户选定R22回执；预生成WAV执行，日志/采集/产品结论分别保存
  execution_choices: []
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: query
  params:
    text: 帮我查一下我的世界基岩版最近一次更新，说明日期和主要变化。
- kind: wait_event
  name: query_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 我的世界
    - 基岩
    - 更新
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: answer_finished
  params:
    role: body
    timeout_s: 40
    quiet_s: 0.6
- kind: audio_record
  name: answer_tail
  params:
    max_seconds: 10
cleanup:
- kind: audio_play
  name: cleanup_exit
  params:
    text: 不聊了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
