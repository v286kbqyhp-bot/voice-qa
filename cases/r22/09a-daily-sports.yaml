schema_version: 1
case_id: R22-09A-DAILY-SPORTS
title: R22 9 日常退出重进 09a-daily-sports
domain: ai
severity: important
source:
  manifest: sources/r22/manifest.json
  section: '9'
  original_sha256: 2ba7a35b281a0f9a271d7570439701fae2d8f5df0428bc599ae48e4aa335ce77
  scope: R22第9项两次日常使用之一；普通聊天后搜索，再通过真实返回路径退出
  execution_choices:
  - 按正常速度顺序做两次独立退出/重进，每次先聊天后搜索；不做高频点击或故障注入
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
  - device_ui_exit
steps:
- kind: sleep
  name: normal_pace
  params:
    seconds: 5.2
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: chat
  params:
    text: 我今天打球赢了一次。
- kind: wait_event
  name: chat_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 打球
    - 皮卡丘
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: chat_reply
  params:
    role: body
    timeout_s: 40
    quiet_s: 0.6
- kind: audio_play
  name: query
  params:
    text: 帮我查一下羽毛球单打怎么计分。
- kind: wait_event
  name: query_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 羽毛球
    - 单打
    - 计分
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: search_reply
  params:
    role: body
    timeout_s: 40
    quiet_s: 0.6
- kind: device_action
  name: daily_ui_exit
  params:
    action: exit_voice
- kind: wait_event
  name: daily_exit_requested
  params:
    event: session_end_requested
    where:
      reason: android_back
    timeout_s: 10
- kind: wait_event
  name: daily_closed
  params:
    event: ready_next_wake
    timeout_s: 15
artifacts:
- audio
- logcat
- timeline
