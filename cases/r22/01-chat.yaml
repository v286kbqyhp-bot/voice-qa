schema_version: 1
case_id: R22-01-CHAT
title: R22 1 普通聊天速度
domain: ai
severity: important
source:
  manifest: sources/r22/manifest.json
  section: '1'
  original_sha256: 2ba7a35b281a0f9a271d7570439701fae2d8f5df0428bc599ae48e4aa335ce77
  scope: 原话两轮；字幕和PCM时延分开记录，物理听感待复核
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: chat_1
  params:
    text: 我今天打球赢了一次。
- kind: wait_event
  name: asr_1
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: reply_1
  params:
    role: body
    timeout_s: 40
    quiet_s: 0.7
- kind: audio_play
  name: chat_2
  params:
    text: 你觉得打羽毛球最有趣的是什么？
- kind: wait_event
  name: asr_2
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: reply_2
  params:
    role: body
    timeout_s: 40
    quiet_s: 0.7
cleanup:
- kind: audio_play
  name: cleanup_exit
  params:
    text: 不聊了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
