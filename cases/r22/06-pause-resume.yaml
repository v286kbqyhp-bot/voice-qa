schema_version: 1
case_id: R22-06-PAUSE-RESUME
title: R22 6 插话、续讲
domain: ai
severity: important
source:
  manifest: sources/r22/manifest.json
  section: '6'
  original_sha256: 2ba7a35b281a0f9a271d7570439701fae2d8f5df0428bc599ae48e4aa335ce77
  scope: 用户选定R22回执；预生成WAV执行，日志/采集/产品结论分别保存
  execution_choices:
  - 原文未指定查询，选择恐龙灭绝作为可续讲长结果；本地内容规则仅辅助定位正文，并非服务端role或精确进度
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: query
  params:
    text: 帮我查一下恐龙为什么会灭绝。
- kind: wait_event
  name: query_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 恐龙
    - 灭绝
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_speech
  name: body_active
  params:
    role: body
    phase_role: search_body
    require_sound: true
    delay_s: 0.8
    timeout_s: 45
- kind: audio_play
  name: pause
  params:
    text: 等一下
- kind: wait_event
  name: pause_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 等一下
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_event
  name: speaking_stopped
  params:
    event: worker_speaking
    where:
      speaking: false
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: sleep
  name: settle
  params:
    seconds: 0.4
- kind: audio_play
  name: resume
  params:
    text: 继续刚才的搜索结果
- kind: wait_event
  name: resume_asr
  params:
    event: voice.asr_text_changed
    where:
      is_final: true
    text_contains_any:
    - 继续
    - 搜索结果
    same_trace: true
    after_last_play: true
    timeout_s: 10
- kind: wait_output
  name: resumed_answer
  params:
    role: body
    timeout_s: 40
    quiet_s: 0.6
- kind: audio_record
  name: resume_tail
  params:
    max_seconds: 5
cleanup:
- kind: audio_play
  name: cleanup_exit
  params:
    text: 不聊了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
