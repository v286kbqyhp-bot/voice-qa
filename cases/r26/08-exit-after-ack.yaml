schema_version: 1
case_id: R26-08-EXIT-AFTER-ACK
title: R26 明确退出：等待词结束后单次安静对照
domain: ai
severity: important
source:
  manifest: sources/r26/manifest.json
  original_sha256: fb374885e98b2fa0e57be0294d8d8eb2f5861b40218bb622af924163f0f4e8a9
  section: 8 明确退出
  scope: R26原话术；播放、设备字幕、独立录音ASR和实体观察分别记录。
  execution_choices:
  - 字幕/说话状态/麦克风活动只用于有界调度，不能替代实际声音、任务身份或实体动作验收。
  - 首次失败保留；异常先停止批次与收尾，普通聊天也异常时不继续后续用例。
  - session_end_requested在该客户端日志不带trace；仅接本轮绑定房内退出播放之后的user_session_exit，并核对关闭和新唤醒，不能要求该事件存在未提供的trace字段。
  - 首次退出词与等待语音邻近且被截断；本诊断原话不变，等待确认词播完的静音代理后再退出，若正文已开始则阻塞，不拼接为初次通过。
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
  - device_ui_exit
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 18
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 18
- kind: audio_play
  name: query
  params:
    text: 帮我查恐龙为什么会灭绝
- kind: wait_output
  name: search_ack_finished
  params:
    role: ack
    timeout_s: 12
    quiet_s: 0.2
    fail_if_body_started: true
- kind: audio_play
  name: exit
  params:
    text: 算了，退出聊天
- kind: wait_event
  name: explicit_exit_request
  params:
    event: session_end_requested
    where:
      reason: user_session_exit
    after_last_play: true
    timeout_s: 12
- kind: wait_event
  name: first_closed
  params:
    event: ready_next_wake
    timeout_s: 12
- kind: sleep
  name: room_reentry_gap
  params:
    seconds: 1.0
- kind: audio_play
  name: reenter_wake
  params:
    text: 小可小可
- kind: wait_event
  name: reenter_bind
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 18
- kind: wait_event
  name: reenter_input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 18
- kind: audio_play
  name: chat
  params:
    text: 我今天有点开心
- kind: audio_record
  name: new_chat_response
  params:
    max_seconds: 15
cleanup:
- kind: device_action
  name: cleanup_home
  params:
    action: exit_voice
    if_session_active: true
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 12
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
