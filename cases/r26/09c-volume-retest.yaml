schema_version: 1
case_id: R26-09C-VOLUME-RETEST
title: R26 音量调小：用户要求重新复测
domain: ai
severity: important
source:
  manifest: sources/r26/manifest.json
  original_sha256: fb374885e98b2fa0e57be0294d8d8eb2f5861b40218bb622af924163f0f4e8a9
  section: 9 原设备功能
  scope: R26原话术；播放、设备字幕、独立录音ASR和实体观察分别记录。
  execution_choices:
  - 字幕/说话状态/麦克风活动只用于有界调度，不能替代实际声音、任务身份或实体动作验收。
  - 首次失败保留；异常先停止批次与收尾，普通聊天也异常时不继续后续用例。
  - 用户确认可以现场观察，且明确跳过升高；本文件不包含升降话术或指令。一房只测一个动作，避免5秒闲置关闭污染下一句。
  - 用户明确要求由执行器播放、本人观察硬件；本分支只等待真实硬件唤醒绑定，跳过云端input_ready。记录控制词是否播放和端侧事件，实体变化以用户反馈为准；不证明云端语音链路已恢复。
  - 用户反馈灯有反馈、声音似乎卡住，明确要求重新测试。本次仅复测音量；唤醒后留4秒招呼/连接裕量，再实际播放同一预生成文件，不以裕量充当input_ready证明。
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
  - device_ui_exit
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 18
- kind: sleep
  name: local_greeting_margin
  params:
    seconds: 4.0
- kind: audio_play
  name: volume
  params:
    text: 声音小一点
- kind: audio_record
  name: observe_physical_action
  params:
    max_seconds: 12
cleanup:
- kind: device_action
  name: cleanup_home
  params:
    action: exit_voice
    if_session_active: true
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 12
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
