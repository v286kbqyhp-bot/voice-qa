schema_version: 1
case_id: R19-D
title: 插话与续讲
domain: ai
severity: important
requirement_refs:
- R19-D
tags:
- r19
- voice
source:
  manifest: sources/r19/manifest.json
  original_sha256: 1b7606ba1658c894cf454ca6b78a55718f242949a72cd928a49151b248b6d9c9
  section: D
  expected:
  - 结果播到一半插话，停止或让出播报并接话；对话结束后续讲。
  - 恢复原结果，不重新查询或无故无结果；记录具体重复范围。
  receipt_template: r19_v1
requires:
  target: real_device
  capabilities:
  - audio_hil
blockers:
- 已核验设备身份/P2资格未绑定
- 正文中点/设备声学重叠与任务进度映射未接入
steps:
- kind: audio_play
  name: query
  params:
    text: 帮我查一下恐龙为什么会灭绝。
- kind: wait_event
  name: search_body_midpoint
  params:
    event: r19_search_body_midpoint
    same_trace: true
    timeout_s: 30
    require_audible_device_speech: true
- kind: audio_play
  name: interrupt
  params:
    text: 停一下，我先说一句，我今天看了一本科普书。
- kind: wait_event
  name: chat_done
  params:
    event: r19_turn_output_finished
    same_trace: true
    timeout_s: 30
- kind: audio_play
  name: resume
  params:
    text: 继续刚才的搜索结果。
- kind: expect
  name: D_oracle
  params:
    contract: '{{contract.R19.D_oracle}}'
artifacts:
- audio
- logcat
- timeline
