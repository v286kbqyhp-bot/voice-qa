schema_version: 1
case_id: R23-01-CHAT
title: R23 开始前普通聊天与三主题基线
domain: ai
severity: important
source:
  manifest: sources/r23/manifest.json
  original_sha256: ba3a7d878f8c818facd34c9a750b53ef940ada89f938d2a81f7edb52383f9701
  section: 普通聊天／开始测试
  scope: 原文三个聊天主题；话术由执行方选定。当前只有一台目标机，不声称跨机对照；实听与日志分列。
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: chat_1
  params:
    text: 我今天画了一只小猫
- kind: wait_output
  name: reply_1
  params:
    role: body
    timeout_s: 30
    quiet_s: 0.6
- kind: audio_play
  name: chat_2
  params:
    text: 我今天打篮球投进了一个球。
- kind: wait_output
  name: reply_2
  params:
    role: body
    timeout_s: 30
    quiet_s: 0.6
- kind: audio_play
  name: chat_3
  params:
    text: 我喜欢皮卡丘。
- kind: wait_output
  name: reply_3
  params:
    role: body
    timeout_s: 30
    quiet_s: 0.6
cleanup:
- kind: audio_play
  name: cleanup_cancel
  params:
    text: 不用查了
    if_session_active: true
    idle_finish_before_s: 4.0
    startup_budget_s: 1.0
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    if_session_active: true
    timeout_s: 15
artifacts:
- audio
- logcat
- timeline
