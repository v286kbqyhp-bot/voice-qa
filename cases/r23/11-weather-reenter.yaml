schema_version: 1
case_id: R23-11-WEATHER-REENTER
title: R23 从天气结果退出重进继续
domain: ai
severity: important
source:
  manifest: sources/r23/manifest.json
  original_sha256: ba3a7d878f8c818facd34c9a750b53ef940ada89f938d2a81f7edb52383f9701
  section: 退出再进入
  scope: R23原话术与预期；字幕、播放、PCM和实际听到分列，不以日志代替实听
  execution_choices:
  - 更换为已能返回结果的北京天气建立恢复上下文；当轮正文字幕后留1秒调度裕量，再实际返回，录音ASR复核是否有首段声音；不将此裕量当精确播放进度
  - 重进后直接说R23原文继续，未配置任务ID时只按真实答复判断是否明确有无记录
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
  - device_ui_exit
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: query
  params:
    text: 帮我查北京今天的天气
- kind: wait_speech
  name: weather_body
  params:
    role: body
    text_contains_any:
    - 北京
    require_sound: false
    timeout_s: 35
- kind: sleep
  name: body_dispatch_margin
  params:
    seconds: 1.0
- kind: device_action
  name: exit_home
  params:
    action: exit_voice
- kind: wait_event
  name: exit_requested
  params:
    event: session_end_requested
    where:
      reason: android_back
    timeout_s: 10
- kind: wait_event
  name: first_closed
  params:
    event: ready_next_wake
    timeout_s: 15
- kind: sleep
  name: normal_reentry_gap
  params:
    seconds: 5.2
- kind: audio_play
  name: reenter_wake
  params:
    text: 小可小可
- kind: wait_event
  name: reenter_bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: reenter_input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: resume
  params:
    text: 继续刚才的搜索结果
- kind: audio_record
  name: resumed_or_honest_absence
  params:
    max_seconds: 25
cleanup:
- kind: device_action
  name: cleanup_home
  params:
    action: exit_voice
    if_session_active: true
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
