schema_version: 1
case_id: R23-10-INTERRUPT
title: R23 播报中停一下
domain: ai
severity: important
source:
  manifest: sources/r23/manifest.json
  original_sha256: ba3a7d878f8c818facd34c9a750b53ef940ada89f938d2a81f7edb52383f9701
  section: 取消、插话／插话
  scope: R23原话术与预期；字幕、播放、PCM和实际听到分列，不以日志代替实听
  execution_choices:
  - 以恐龙结果作为较长正文，内容规则只辅助定位；实际是否让出声音须录音复核；不因没有精确ASR就跳过后续观察
requires:
  target: real_device
  capabilities:
  - audio_hil
  - interaction_wait
  - device_ui_exit
steps:
- kind: audio_play
  name: wake
  params:
    text: 小可小可
- kind: wait_event
  name: bind_current_wake
  params:
    event: started
    where:
      source: hardware
    bind_trace: true
    timeout_s: 20
- kind: wait_event
  name: input_ready
  params:
    event: input_ready
    alternative_events:
    - input_ready_fallback
    same_trace: true
    timeout_s: 20
- kind: audio_play
  name: query
  params:
    text: 帮我查恐龙为什么会灭绝
- kind: wait_speech
  name: body_active
  params:
    role: body
    phase_role: search_body
    require_sound: true
    delay_s: 0.3
    timeout_s: 40
- kind: audio_play
  name: interrupt
  params:
    text: 停一下
- kind: audio_record
  name: stop_observation
  params:
    max_seconds: 12
cleanup:
- kind: device_action
  name: cleanup_home
  params:
    action: exit_voice
    if_session_active: true
- kind: wait_event
  name: cleanup_closed
  params:
    event: ready_next_wake
    timeout_s: 15
    if_session_active: true
artifacts:
- audio
- logcat
- timeline
